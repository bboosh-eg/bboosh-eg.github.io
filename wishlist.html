<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Favorites - Bboosh</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="wishlist-page">

        <div class="wishlist-header">

            <p class="shop-eyebrow">
                Your little collection ♡
            </p>

            <h1>My Favorites</h1>

            <p>
                All the handmade pieces you fell in love with.
            </p>

        </div>


        <div
            class="products-container"
            id="wishlistContainer"
        ></div>


        <div
            class="empty-wishlist"
            id="emptyWishlist"
        >
            <span>♡</span>

            <h2>Your favorites are empty</h2>

            <p>
                Looks like you haven't fallen in love with anything yet.
            </p>

            <a href="shop.html" class="view-all-btn">
                Explore Bboosh
                <span>→</span>
            </a>

        </div>

    </section>

<script src="products.js"></script>
<script src="wishlist.js"></script>
<script src="common.js"></script>

</body>
</html>

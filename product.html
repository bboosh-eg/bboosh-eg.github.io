<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product - Bboosh</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="product-page">

        <!-- PRODUCT GALLERY -->

        <div class="product-gallery">

            <div class="main-product-image">

                <button
                    class="gallery-arrow gallery-prev"
                    id="galleryPrev"
                    type="button"
                >
                    ‹
                </button>

                <img
                    id="productImage"
                    src=""
                    alt="Product"
                >

                <button
                    class="gallery-arrow gallery-next"
                    id="galleryNext"
                    type="button"
                >
                    ›
                </button>

            </div>


            <div
                class="product-thumbnails"
                id="productThumbnails"
            ></div>

        </div>


        <!-- PRODUCT INFO -->

        <div class="product-page-info">

            <span class="product-badge">
                ♡ Handmade
            </span>

            <h1 id="productName"></h1>

            <p id="productDescription"></p>

            <p id="productPrice"></p>

<button
    id="addCartBtn"
    class="add-cart-btn"
    type="button"
    onclick="addToCart()"
>
    Add to Cart ♡
</button>

        </div>

    </section>
<!-- PRODUCT IMAGE LIGHTBOX -->

<div class="product-lightbox" id="productLightbox">

    <button
        class="lightbox-close"
        id="lightboxClose"
        type="button"
    >
        ×
    </button>

    <img
        id="lightboxImage"
        src=""
        alt="Product preview"
    >

    <p class="lightbox-hint">
        Click anywhere outside the image to close ♡
    </p>

</div>
<!-- MINI CART DRAWER -->

<div class="cart-overlay" id="cartOverlay"></div>

<aside class="mini-cart" id="miniCart">

    <div class="mini-cart-header">
        <h2>Your Cart ♡</h2>

        <button
            class="mini-cart-close"
            id="miniCartClose"
            type="button"
        >
            ×
        </button>
    </div>

    <div
        class="mini-cart-items"
        id="miniCartItems"
    ></div>

    <div class="mini-cart-footer">

        <div class="mini-cart-total">
            <span>Total</span>
            <strong id="miniCartTotal">
                0 EGP
            </strong>
        </div>

        <a
            href="cart.html"
            class="mini-cart-view-btn"
        >
            View Cart →
        </a>

        <a
            href="checkout.html"
            class="mini-cart-checkout-btn"
        >
            Checkout ♡
        </a>

    </div>

</aside>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="products.js"></script>

<script src="product.js"></script>

<script src="common.js"></script>
</body>

</html>
